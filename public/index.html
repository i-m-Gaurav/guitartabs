<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0e10">
  <meta name="description" content="TabVault – your personal guitar tabs collection.">
  <title>TabVault – My Guitar Library</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23f5a524' d='M12 22.5c-1.7 0-8-7.3-8-13.5C4 4.4 7.4 1.5 12 1.5s8 2.9 8 7.5c0 6.2-6.3 13.5-8 13.5Z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <div class="app">
    <!-- Mobile top bar -->
    <header class="topbar">
      <a href="#/dashboard" class="brand brand-compact" aria-label="TabVault home">
        <span class="brand-mark" data-logo></span>
        <span class="brand-text"><strong>TabVault</strong></span>
      </a>
      <a href="#/new" class="btn primary sm topbar-add"><span data-icon="plus"></span>New</a>
    </header>

    <!-- Sidebar (becomes a bottom bar on phones) -->
    <aside class="sidebar" aria-label="Main navigation">
      <a href="#/dashboard" class="brand" aria-label="TabVault home">
        <span class="brand-mark" data-logo></span>
        <span class="brand-text">
          <strong>TabVault</strong>
          <small>My Guitar Library</small>
        </span>
      </a>

      <nav class="nav">
        <a href="#/dashboard" class="nav-link" data-nav="dashboard" title="Dashboard">
          <span data-icon="grid"></span><span class="nav-text">Dashboard</span>
        </a>
        <a href="#/songs" class="nav-link" data-nav="songs" title="My Songs">
          <span data-icon="music"></span><span class="nav-text">My Songs</span>
        </a>
        <a href="#/new" class="nav-link nav-add" data-nav="new" title="Add New Song">
          <span data-icon="plus"></span><span class="nav-text">Add New Song</span>
        </a>
        <a href="#/recent" class="nav-link" data-nav="recent" title="Recently Added">
          <span data-icon="clock"></span><span class="nav-text">Recently Added</span>
        </a>
        <a href="#/settings" class="nav-link" data-nav="settings" title="Settings">
          <span data-icon="sliders"></span><span class="nav-text">Settings</span>
        </a>
      </nav>

      <div class="sidebar-foot">
        <div class="storage-pill" title="Everything is stored in this browser's LocalStorage">
          <span class="dot"></span><span id="sidebar-count">Saved locally</span>
        </div>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <div id="view" class="view"></div>
    </main>
  </div>

  <!-- Practice mode overlay -->
  <div id="practice" class="practice" tabindex="-1" hidden role="dialog" aria-modal="true" aria-label="Practice mode"></div>

  <div id="modal-root"></div>
  <div id="toasts" class="toasts"></div>
  <div id="sr-live" class="sr-only" aria-live="polite"></div>
  <input type="file" id="import-file" accept=".json,application/json" hidden>

  <noscript>
    <p class="noscript">TabVault needs JavaScript enabled to work.</p>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
